services:
  - type: web
    name: tiktok-live-konektor
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: WS_TOKEN
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: API_ALLOWED_ORIGINS
        sync: false
      - key: MAX_EVENT_BYTES
        value: 65536
      - key: TIKTOK_HTTP_TIMEOUT_MS
        value: 10000
      - key: TIKTOK_DEBUG
        value: "false"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TIKTOK_USERNAME
        value: jalurtarot
      - key: TIKTOK_ROOM_ID
        sync: false
      - key: EULER_API_KEY
        sync: false
      - key: PYTHON_FALLBACK_HOSTNAME
        fromService:
          type: web
          name: tiktok-live-python
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: PYTHON_FALLBACK_TOKEN
        fromService:
          type: web
          name: tiktok-live-python
          envVarKey: PYTHON_BRIDGE_TOKEN
  - type: web
    name: tiktok-live-python
    runtime: python
    plan: free
    buildCommand: pip install -r python_fallback/requirements.txt
    startCommand: uvicorn python_fallback.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHON_BRIDGE_TOKEN
        generateValue: true

