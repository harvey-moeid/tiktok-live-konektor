services:
  - type: web
    name: tiktok-live-konektor
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: WS_TOKEN
        generateValue: true
      - key: MAX_EVENT_BYTES
        value: 65536
      - key: TIKTOK_HTTP_TIMEOUT_MS
        value: 10000
      - key: TIKTOK_DEBUG
        value: "false"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TIKTOK_USERNAME
        sync: false
      - key: TIKTOK_ROOM_ID
        sync: false
