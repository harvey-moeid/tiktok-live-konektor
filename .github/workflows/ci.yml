name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: test -s client/dist/index.html
      - if: matrix.node == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-live-konektor-dist
          path: client/dist
          if-no-files-found: error

  render-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - name: Install exactly like Render dashboard
        run: npm install --no-audit --no-fund
      - name: Build client with production environment
        run: npm run build
      - name: Verify built entrypoint
        run: test -s client/dist/index.html
