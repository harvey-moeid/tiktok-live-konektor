name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: test -s client/dist/index.html
      - if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-live-konektor-dist
          path: client/dist
          if-no-files-found: error