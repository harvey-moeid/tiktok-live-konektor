name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - run: npm install --no-audit --no-fund
      - name: Audit runtime dependencies
        run: |
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          node scripts/security-audit.mjs audit.json
